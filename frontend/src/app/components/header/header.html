<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <line x1="12" y1="12" x2="4" y2="4"></line>
        <line x1="12" y1="12" x2="20" y2="4"></line>
        <line x1="12" y1="12" x2="4" y2="20"></line>
        <line x1="12" y1="12" x2="20" y2="20"></line>
        <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle>
        <circle cx="4" cy="4" r="2" fill="currentColor" stroke="none"></circle>
        <circle cx="20" cy="4" r="2" fill="currentColor" stroke="none"></circle>
        <circle cx="4" cy="20" r="2" fill="currentColor" stroke="none"></circle>
        <circle cx="20" cy="20" r="2" fill="currentColor" stroke="none"></circle>
      </svg>
      <span class="brand-name">SmartNews</span>
    </a>

    @if (isArticlesPage()) {
      <form class="search" (submit)="$event.preventDefault(); search(searchBox.value)">
        <lucide-icon name="search" [size]="20" />
        <input #searchBox type="search" placeholder="Search" [value]="searchTerm()" />
      </form>
    }

    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <lucide-icon name="newspaper" />
        <span>Articles</span>
      </a>
      <a routerLink="/saved" routerLinkActive="active">
        <lucide-icon name="bookmark" />
        <span>Saved</span>
      </a>
      <a routerLink="/stats" routerLinkActive="active">
        <lucide-icon name="chart-column" />
        <span>Stats</span>
      </a>
      <a routerLink="/pipeline" routerLinkActive="active">
        <lucide-icon name="workflow" />
        <span>Pipeline</span>
      </a>
      <a routerLink="/about" routerLinkActive="active">
        <lucide-icon name="info" />
        <span>About</span>
      </a>
    </nav>
  </div>
</header>
