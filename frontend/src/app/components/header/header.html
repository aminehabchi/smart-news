<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <line x1="12" y1="12" x2="4" y2="4"></line>
        <line x1="12" y1="12" x2="20" y2="4"></line>
        <line x1="12" y1="12" x2="4" y2="20"></line>
        <line x1="12" y1="12" x2="20" y2="20"></line>
        <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle>
        <circle cx="4" cy="4" r="2" fill="currentColor" stroke="none"></circle>
        <circle cx="20" cy="4" r="2" fill="currentColor" stroke="none"></circle>
        <circle cx="4" cy="20" r="2" fill="currentColor" stroke="none"></circle>
        <circle cx="20" cy="20" r="2" fill="currentColor" stroke="none"></circle>
      </svg>
      <span class="brand-name">NLP Scraper</span>
    </a>

    <form class="search" (submit)="$event.preventDefault(); search(searchBox.value)">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path
          d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"
        ></path>
      </svg>
      <input
        #searchBox
        type="search"
        placeholder="Search articles..."
        [value]="searchTerm()"
      />
    </form>

    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Articles</a>
      <a routerLink="/saved" routerLinkActive="active">Saved</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
    </nav>
  </div>
</header>
